name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - name: Verify SARIF generation
        run: |
          set +e
          tracegate examples/basic.yaml --output /tmp/tracegate-results.json --sarif /tmp/tracegate-results.sarif
          code=$?
          test -s /tmp/tracegate-results.sarif
          test "$code" -eq 1
